services:
  mygold:
    build: .
    container_name: mygold
    restart: unless-stopped
    # 允许容器访问同机运行的 OpenClaw Gateway（host.docker.internal:18789）。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    env_file:
      - ./.env
    environment:
      TZ: Asia/Shanghai
      FUND_QUOTE_INTERVAL_SECONDS: "60"
      MYGOLD_OPENCLAW_WEBHOOK_URL: ${MYGOLD_OPENCLAW_WEBHOOK_URL:-}
      MYGOLD_OPENCLAW_WEBHOOK_TOKEN: ${MYGOLD_OPENCLAW_WEBHOOK_TOKEN:-}
      MYGOLD_OPENCLAW_TARGET: ${MYGOLD_OPENCLAW_TARGET:-}
      MYGOLD_FUND_ALERT_THRESHOLD_PCT: ${MYGOLD_FUND_ALERT_THRESHOLD_PCT:-1.0}
      MYGOLD_FUND_ALERT_TIMEOUT_SECONDS: ${MYGOLD_FUND_ALERT_TIMEOUT_SECONDS:-8}
    volumes:
      - ./data:/app/backend/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=8)",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

  caddy:
    image: ${CADDY_IMAGE:-docker.m.daocloud.io/library/caddy:2-alpine}
    container_name: mygold-caddy
    restart: unless-stopped
    depends_on:
      - mygold
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
