services:
  mygold:
    build: .
    container_name: mygold
    restart: unless-stopped
    ports:
      - "${MYGOLD_PORT:-80}:8000"
    environment:
      TZ: Asia/Shanghai
      TICK_INTERVAL_SECONDS: "20"
      CURVE_SNAPSHOT_INTERVAL_SECONDS: "180"
      SELL_FEE_RATE: "0.004"
      MOVE_WINDOW_SECONDS: "900"
      MOVE_PERSIST_CHECKS: "3"
      EVENT_COOLDOWN_SECONDS: "1800"
    volumes:
      - ./data:/app/backend/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=8)",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
