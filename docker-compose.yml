services:
  mygold:
    build: .
    container_name: mygold
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      TZ: Asia/Shanghai
      FUND_QUOTE_INTERVAL_SECONDS: "60"
    volumes:
      - ./data:/app/backend/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=8)",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

  caddy:
    image: ${CADDY_IMAGE:-docker.m.daocloud.io/library/caddy:2-alpine}
    container_name: mygold-caddy
    restart: unless-stopped
    depends_on:
      - mygold
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
